<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">First-Proof Pilot Economics illustrative interface mockup</title>
  <desc id="desc">An original vector mockup of a pilot economics dashboard with editable employer assumptions, scenario cards, feasibility, and human-review guardrails.</desc>
  <rect width="1440" height="1050" fill="#f4f7f5"/>
  <rect width="1440" height="82" fill="#ffffff"/>
  <path d="M0 81.5H1440" stroke="#e2e8e4"/>
  <circle cx="54" cy="41" r="20" fill="#d9eee4"/><path d="M47 42l5 5 10-12" fill="none" stroke="#176b4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="38" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#102b22">First-Proof</text><text x="88" y="58" font-family="Arial,sans-serif" font-size="12" fill="#728179">PILOT ECONOMICS · DEMO</text>
  <text x="1194" y="47" font-family="Arial,sans-serif" font-size="13" fill="#52635a">Fictional data only</text><rect x="1314" y="24" width="90" height="34" rx="17" fill="#e8f2ed"/><text x="1335" y="46" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#176b4d">MVP</text>
  <text x="62" y="137" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#176b4d">EMPLOYER PILOT · MEXICO</text>
  <text x="62" y="181" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#102b22">Can this pilot fit your budget?</text>
  <text x="62" y="211" font-family="Arial,sans-serif" font-size="16" fill="#627168">Estimate the human review time and compare it with what employers can spend.</text>
  <rect x="1126" y="130" width="252" height="48" rx="12" fill="#176b4d"/><text x="1152" y="160" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Reset demo assumptions</text>
  <rect x="62" y="244" width="858" height="400" rx="18" fill="#fff" stroke="#e0e8e3"/>
  <text x="92" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102b22">Pilot assumptions</text><text x="92" y="309" font-family="Arial,sans-serif" font-size="13" fill="#728179">Change any input to update the estimate instantly.</text>
  <text x="92" y="355" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#35473d">Candidates</text><rect x="92" y="370" width="238" height="52" rx="10" fill="#fbfcfb" stroke="#d8e1db"/><text x="112" y="403" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102b22">12</text>
  <text x="352" y="355" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#35473d">Employers</text><rect x="352" y="370" width="238" height="52" rx="10" fill="#fbfcfb" stroke="#d8e1db"/><text x="372" y="403" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102b22">3</text>
  <text x="612" y="355" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#35473d">Review minutes / candidate</text><rect x="612" y="370" width="278" height="52" rx="10" fill="#fbfcfb" stroke="#d8e1db"/><text x="632" y="403" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102b22">10 min</text>
  <text x="92" y="463" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#35473d">Reviewer cost / hour</text><rect x="92" y="478" width="368" height="52" rx="10" fill="#fbfcfb" stroke="#d8e1db"/><text x="112" y="511" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102b22">$180 MXN</text>
  <text x="482" y="463" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#35473d">Total pilot budget</text><rect x="482" y="478" width="408" height="52" rx="10" fill="#fbfcfb" stroke="#d8e1db"/><text x="502" y="511" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102b22">$500 MXN</text>
  <text x="92" y="571" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#35473d">Max willingness to pay / employer</text><rect x="92" y="585" width="368" height="42" rx="10" fill="#fbfcfb" stroke="#d8e1db"/><text x="112" y="613" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#102b22">$250 MXN</text>
  <text x="492" y="603" font-family="Arial,sans-serif" font-size="12" fill="#728179">Fictional employer responses · editable</text>
  <rect x="944" y="244" width="434" height="400" rx="18" fill="#fff" stroke="#e0e8e3"/>
  <text x="974" y="285" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102b22">Baseline estimate</text><rect x="1220" y="261" width="127" height="28" rx="14" fill="#edf5f0"/><text x="1237" y="280" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#176b4d">WITHIN BUDGET</text>
  <text x="974" y="343" font-family="Arial,sans-serif" font-size="12" fill="#728179">TOTAL HUMAN REVIEW COST</text><text x="974" y="395" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102b22">$360</text><text x="1082" y="394" font-family="Arial,sans-serif" font-size="16" fill="#52635a">MXN</text>
  <path d="M974 416H1348" stroke="#e7ece9"/>
  <text x="974" y="454" font-family="Arial,sans-serif" font-size="13" fill="#627168">Cost per candidate</text><text x="1328" y="454" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102b22">$30 MXN</text>
  <text x="974" y="491" font-family="Arial,sans-serif" font-size="13" fill="#627168">Cost per employer</text><text x="1328" y="491" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102b22">$120 MXN</text>
  <text x="974" y="528" font-family="Arial,sans-serif" font-size="13" fill="#627168">Budget remaining</text><text x="1328" y="528" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#176b4d">+$140 MXN</text>
  <text x="974" y="565" font-family="Arial,sans-serif" font-size="13" fill="#627168">Willingness-to-pay gap</text><text x="1328" y="565" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#176b4d">+$390 MXN</text>
  <text x="974" y="612" font-family="Arial,sans-serif" font-size="11" fill="#849188">Positive gaps mean more coverage than estimated cost.</text>
  <text x="62" y="704" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#102b22">Compare scenarios</text><text x="62" y="728" font-family="Arial,sans-serif" font-size="13" fill="#728179">Only review time changes: 0.75× optimistic · 1× baseline · 1.5× pessimistic.</text>
  <rect x="62" y="754" width="414" height="146" rx="16" fill="#fff" stroke="#dce8e1"/><text x="88" y="790" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#176b4d">OPTIMISTIC</text><text x="88" y="831" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102b22">$270 MXN</text><text x="88" y="862" font-family="Arial,sans-serif" font-size="13" fill="#627168">7.5 min per candidate · $22.50 per candidate</text>
  <rect x="494" y="754" width="414" height="146" rx="16" fill="#fff" stroke="#dce8e1"/><text x="520" y="790" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315d49">BASELINE</text><text x="520" y="831" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102b22">$360 MXN</text><text x="520" y="862" font-family="Arial,sans-serif" font-size="13" fill="#627168">10 min per candidate · $30 per candidate</text>
  <rect x="926" y="754" width="452" height="146" rx="16" fill="#fff" stroke="#dce8e1"/><text x="952" y="790" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9b5b20">PESSIMISTIC</text><text x="952" y="831" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102b22">$540 MXN</text><text x="952" y="862" font-family="Arial,sans-serif" font-size="13" fill="#627168">15 min per candidate · $45 per candidate</text>
  <rect x="62" y="930" width="1316" height="82" rx="16" fill="#fff8eb" stroke="#f1dfbd"/><circle cx="96" cy="971" r="14" fill="#f3dfb9"/><text x="92" y="977" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#80521e">!</text><text x="124" y="962" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#553e1e">Proposed pilot stop rules — not validated findings</text><text x="124" y="986" font-family="Arial,sans-serif" font-size="12" fill="#715d3e">Fewer than 2/3 employers would pay again · Median review &gt;10 min · No useful additional hiring evidence</text>
</svg>
